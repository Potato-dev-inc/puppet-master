# Codex reports its lifecycle to Puppet Master (Hook Lane, docs/specs/hook-lane/PROBES.md).
# Installed as a managed entry in the project's `.codex/hooks.json`; the user trusts it once per
# project path in Codex (`/hooks`). Probes on 0.162.1: trust covers the hook DEFINITION only (P-C1)
# and is keyed by the file's absolute path and the entry's position (P-C2); `%VAR%` is not expanded
# (P-C4); SessionStart fires with the first prompt, not at startup.
#
# EVERY BYTE of the rendered entries is pinned by `agent_hooks/tests/golden/codex-hooks.json`:
# changing this file makes every user re-trust Puppet Master's Codex hooks.
[hooks]
schema = 1
install = "project_file"
delivery = "async"
# Codex clamps SessionEnd/Interrupt hooks to 3 s and warns about anything longer.
vendor_timeout_s = 3
trust = "vendor_review"
tested = ">=0.162.1, <=0.162.1"

[hooks.project_file]
path = ".codex/hooks.json"
layout = "event_groups"
root_key = "hooks"
exclude_from_git = true

[hooks.entry]
type = "command"
command = "{exe_quoted} {args_joined}"
async = true
timeout = 3

[hooks.trust_screen]
pending_phrases = ["hooks need review", "continue without trusting"]
how_to = "In this Codex pane, type /hooks and trust the Puppet Master hooks. You do this once per project."

[[hooks.events]]
vendor = "SessionStart"
pm = "session_start"
fields = { session = "session_id", source = "source", cwd = "cwd", model = "model" }

[[hooks.events]]
vendor = "UserPromptSubmit"
pm = "prompt_submitted"
fields = { session = "session_id", turn = "turn_id", prompt = "prompt" }

[[hooks.events]]
vendor = "PermissionRequest"
pm = "permission_request"
fields = { session = "session_id", turn = "turn_id", tool = "tool_name", command = "tool_input.command" }

[[hooks.events]]
vendor = "PostToolUse"
matcher = "apply_patch"
pm = "tool_post"
fields = { session = "session_id", turn = "turn_id", tool = "tool_name", tool_use = "tool_use_id" }

[[hooks.events]]
vendor = "Stop"
pm = "turn_end"
fields = { session = "session_id", turn = "turn_id", final_text = "last_assistant_message", continuing = "stop_hook_active" }

# Esc fires Stop and then Interrupt for the same turn_id.
[[hooks.events]]
vendor = "Interrupt"
pm = "turn_interrupted"
fields = { session = "session_id", turn = "turn_id" }
