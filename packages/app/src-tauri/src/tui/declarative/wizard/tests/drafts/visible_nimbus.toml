schema_version = 1

[agent]
id = "nimbus"
label = "Nimbus"
description = "Nimbus: a made-up agent with a boxed input row (the wizard's test agent)."
experimental = true

[binary]
names = ["@@COMMAND@@"]
install_hint = "install nimbus"

[tui]
argv = []
idle_after_ms = 1500
quiet_idle_after_ms = 800

# The empty input box: the placeholder inside the box. A running turn, a question or the trust screen is never ready.
[tui.ready]
regex = '\|\s*>\s*type a task'
not_regex = ['ctrl\+c to stop', 'allow nimbus', 'do you trust']

# The stop hint sits next to the spinner for the whole turn and is gone when the reply is done.
[tui.busy]
working_regex = ['ctrl\+c to stop']
idle_regex = ['\|\s*>\s*type a task']

# Banner, the box and its edges, the footer hint and the "done in" row are chrome. Rows are lowercase.
[tui.chrome]
line_regex = [
  '^nimbus\s+[\d.]+',
  '^[+|\-\s]+$',
  '^\|\s*>\s*type a task',
  '^/help for commands',
  '^done in \d+s$',
]

[tui.tool_activity]
line_regex = ['^tool:\s', '^->\s']

[[tui.prompt]]
kind = "trust_folder"
detect_regex = 'do you trust the files in this folder'
choices = [
  { id = "allow_once", text = "1" },
  { id = "deny", text = "2" },
]

[[tui.prompt]]
kind = "command_approval"
detect_regex = 'allow nimbus to .*\[y/n\]'
choices = [
  { id = "allow_once", key = "y" },
  { id = "deny", key = "n" },
]
