# expect-code: AGENT_DEF_HOOKS_SHARED_FILE
# Cursor imports Claude's settings files: PM never writes hooks into them.
schema_version = 1

[agent]
id = "hookbad"
label = "Hook Bad"

[binary]
names = ["hookbad-fixture-not-installed"]
install_hint = "fixture only"

[tui]
argv = []

[hooks]
schema = 1
install = "project_file"
[hooks.project_file]
path = ".claude/settings.local.json"
layout = "event_groups"
root_key = "hooks"
[hooks.entry]
type = "command"
command = "{exe}"
args = "{args}"

[[hooks.events]]
vendor = "Stop"
pm = "turn_end"
fields = { session = "session_id" }
