# Puppet Master's MCP server for one OpenCode launch, with no change to the person's own config.
# Checked live on 1.19.0 (`opencode debug config`): OPENCODE_CONFIG_CONTENT is merged over the
# person's global and project config (their own MCP servers stay) and its `instructions` list adds
# a file next to theirs.
shape = "opencode"
note_in_config = true
# A value the person set themselves is theirs: the launch is left as it was.
skip_if_env = ["OPENCODE_CONFIG_CONTENT"]
[env]
OPENCODE_CONFIG_CONTENT = "{config}"
