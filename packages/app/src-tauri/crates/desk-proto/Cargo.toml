# From desktoplab (github.com/v7ren/desktoplab), commit 6e5360e, MIT. Changed for Puppet Master: renamed crate.
[package]
name = "desk-proto"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"
publish = false
description = "Postcard wire messages, handshake, and HID key codes"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
