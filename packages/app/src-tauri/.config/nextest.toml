# cargo-nextest (https://nexte.st): runs every test in its own process. CI uses it for the library,
# binary and fake-agent end-to-end tests; plain `cargo test` still works for all of them.
#
#   cargo nextest run --lib --bins
#   cargo nextest run --features dev-fake-tui --test fake_tui_e2e
#
# No retries anywhere: a test that fails once is a failure (CI found real races this way).

[profile.default]
retries = 0
# A test still running after 60 s is reported as slow; one still running after 10 minutes is a hang
# and is killed (every e2e wait in the suite is bounded well below that).
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
retries = 0
# Report every failure of the run, not just the first.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Started first in its shard so the rest of the shard runs beside it: two of its turns end on the
# 120 s round timeout by design (see the test), so it takes ~5 minutes whatever else runs.
[[profile.default.overrides]]
filter = "test(=missions::an_agent_that_makes_no_progress_ends_in_the_stuck_card)"
priority = 100
