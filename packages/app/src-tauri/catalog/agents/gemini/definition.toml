# Gemini CLI (google-gemini/gemini-cli), starter. The npm install command and the sign-in
# options come from the project README (https://github.com/google-gemini/gemini-cli), read
# 2026-10-28. Not run on Windows yet, so the card says so.
schema_version = 1

[agent]
id = "gemini"
label = "Gemini CLI"
icon = "GE"
description = "Gemini CLI from Google, run in a visible pane."
kind = "generic"
experimental = true

[binary]
names = ["gemini"]

[install.windows]
source = "https://github.com/google-gemini/gemini-cli"
order = ["npm"]
npm = "@google/gemini-cli"
