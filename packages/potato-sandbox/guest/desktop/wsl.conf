# /etc/wsl.conf for the PM sandbox distro (Ubuntu 24.04). Installed by recipes/base.json.
# Written by Puppet Master for the spike findings: no Windows drives, no Windows programs, no Windows PATH,
# no systemd, one boot hook (pm-sbx-boot.sh) that cuts WSLg and sets the network walls, and its own host name.
# Restart the distro after a change: wsl --terminate <distro>.
# Only this distro reads this file; never use --shutdown, which stops the founder's other distros too.

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[network]
# The sandbox must not show the Windows PC name. WSL's generated /etc/hosts would add a line naming the Windows host
# (with the PC name), so generateHosts is off and the recipe writes /etc/hosts itself. resolv.conf is still generated
# (DNS needs it).
hostname=pm-sandbox
generateHosts=false
generateResolvConf=true

[user]
default=pm

[gpu]
enabled=false

[boot]
systemd=false
command=/usr/local/sbin/pm-sbx-boot.sh
