# /etc/wsl.conf for the PM sandbox distro (Ubuntu 24.04). Installed by recipes/base.json.
# Written by Puppet Master for the spike findings: no Windows drives, no Windows programs, no Windows PATH,
# no systemd, and a boot hook that cuts WSLg. Restart the distro after a change: wsl --terminate <distro>.
# Only this distro reads this file; never use --shutdown, which stops the founder's other distros too.

[automount]
enabled=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=pm

[boot]
systemd=false
command=/usr/local/sbin/pm-no-wslg.sh
