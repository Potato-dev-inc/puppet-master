# /etc/wsl.conf for the few minutes while the sandbox is being set up. The app copies it over /etc/wsl.conf right after the
# guest files arrive and restarts the distro once, so the installer runs WITHOUT systemd (a fresh Ubuntu starts snapd,
# unattended-upgrades, apt-daily and PackageKit, which all compete with apt for the disk and the lock). recipes/base.json
# replaces this file with wsl.conf (the real one) near the start of the install; that one takes effect at the restart after it.
[boot]
systemd=false

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false
