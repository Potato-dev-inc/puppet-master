name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes to main always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  frontend:
    name: Frontend (vitest + tsc)
    # Not moved to ubuntu-latest: it has not been run there, and the app ships for Windows first.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # @puppet-master/app imports @puppet-master/shared through its dist/ output, so build it first.
      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      - name: Unit tests (vitest)
        run: npm run test --workspace=@puppet-master/app

      - name: Typecheck (tsc --noEmit, app and service worker)
        run: npm run typecheck --workspace=@puppet-master/app

  rust:
    name: Rust (nextest --lib --bins)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The LLVM linker that ships with rustc: links the big test executables faster than link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No rust-toolchain.toml in the repo, so this is the stable channel.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # tauri-build needs the frontend output (../dist) and the bundled resources. The debug profile
      # keeps the MCP binary build cheap and shares the cargo cache with the tests below.
      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      - name: Build frontend and bundled resources
        run: npm run build --workspace=@puppet-master/app
        env:
          PUPPET_MASTER_RUST_MCP_PROFILE: debug

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # cargo-nextest: every test in its own process, no retries (packages/app/src-tauri/.config/nextest.toml).
      - name: Unit tests in the library and the binaries
        working-directory: packages/app/src-tauri
        run: cargo nextest run --profile ci --lib --bins

  fake-tui:
    # Dev-only fake agent (tools/pm-fake-tui) on a real ConPTY and a PowerShell host, which the
    # windows-latest runner has. Every test runs in its own process with its own app-data folder
    # (src/fake_tui/world.rs), so the suite is split across four runners and runs in parallel on each.
    name: Fake agent e2e (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri
            tools/pm-fake-tui
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      - name: Build frontend and bundled resources
        run: npm run build --workspace=@puppet-master/app
        env:
          PUPPET_MASTER_RUST_MCP_PROFILE: debug

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Unit tests of the fake agent itself (engine, script format, renderer), once.
      - name: pm-fake-tui unit tests
        if: matrix.shard == 1
        working-directory: tools/pm-fake-tui
        run: cargo test

      # Built once here so the test processes do not each run `cargo build` for it (src/fake_tui/world.rs).
      - name: Build pm-fake-tui
        working-directory: tools/pm-fake-tui
        run: |
          cargo build
          "PM_FAKE_TUI_EXE=$PWD\target\debug\pm-fake-tui.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # fake_tui_e2e.rs, which also includes the Missions and Wizard tests (tests/fake_tui_missions.rs,
      # tests/fake_tui_wizard.rs) through #[path], so there is no separate --test run for them (cargo
      # discovers those files as targets too, without the dev-fake-tui feature they need).
      - name: Fake agent end-to-end tests
        working-directory: packages/app/src-tauri
        run: cargo nextest run --profile ci --features dev-fake-tui --test fake_tui_e2e --partition count:${{ matrix.shard }}/4
