name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes to main always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  frontend:
    name: Frontend (vitest + tsc)
    # Not moved to ubuntu-latest: it has not been run there, and the app ships for Windows first.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # @puppet-master/app imports @puppet-master/shared through its dist/ output, so build it first.
      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      - name: Unit tests (vitest)
        run: npm run test --workspace=@puppet-master/app

      - name: Typecheck (tsc --noEmit, app and service worker)
        run: npm run typecheck --workspace=@puppet-master/app

  rust:
    name: Rust (cargo test --lib, --bins)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No rust-toolchain.toml in the repo, so this is the stable channel.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # tauri-build needs the frontend output (../dist) and the bundled resources. The debug profile
      # keeps the MCP binary build cheap and shares the cargo cache with the tests below.
      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      - name: Build frontend and bundled resources
        run: npm run build --workspace=@puppet-master/app
        env:
          PUPPET_MASTER_RUST_MCP_PROFILE: debug

      - name: Unit tests in the library
        working-directory: packages/app/src-tauri
        run: cargo test --lib

      - name: Unit tests in the binaries
        working-directory: packages/app/src-tauri
        run: cargo test --bins

  fake-tui:
    # Dev-only fake agent (tools/pm-fake-tui). Needs a real ConPTY and a PowerShell host, which the
    # windows-latest runner has. Not verified on a GitHub runner yet: check the first run.
    name: Fake agent e2e (pm-fake-tui)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/src-tauri
            tools/pm-fake-tui
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      - name: Build frontend and bundled resources
        run: npm run build --workspace=@puppet-master/app
        env:
          PUPPET_MASTER_RUST_MCP_PROFILE: debug

      # Unit tests of the fake agent itself: engine, script format and renderer, no console needed.
      - name: pm-fake-tui unit tests
        working-directory: tools/pm-fake-tui
        run: cargo test

      # Runs fake_tui_e2e.rs. It also includes the Missions tests (tests/fake_tui_missions.rs) through
      # #[path], so there is no separate `--test fake_tui_missions` run: that file is auto-discovered as
      # its own target too, and it needs the dev-fake-tui feature, which only this script passes.
      # The harness builds pm-fake-tui itself on first use (src/fake_tui/world.rs). Single-threaded:
      # every test shares one ConPTY world.
      - name: Fake agent end-to-end tests
        run: npm run test:fake-tui
