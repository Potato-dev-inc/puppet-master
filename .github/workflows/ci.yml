name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes to main always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Which jobs this change needs. A docs-only change runs none; a frontend-only change skips the Rust jobs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - .github/workflows/ci.yml
              - packages/app/src-tauri/**
              - tools/pm-fake-tui/**
              - relay/**
              # Read by Rust tests (include_str! or at run time).
              - integrations/**
              - packages/shared/fixtures/**
              - packages/app/src/components/simple/folder-cases.json
            frontend:
              - .github/workflows/ci.yml
              - package.json
              - package-lock.json
              - tsconfig.base.json
              - packages/app/*
              - packages/app/src/**
              - packages/app/public/**
              - packages/shared/**

  frontend:
    name: Frontend (vitest + tsc)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # @puppet-master/app imports @puppet-master/shared through its dist/ output, so build it first.
      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      - name: Unit tests (vitest)
        run: npm run test --workspace=@puppet-master/app

      - name: Typecheck (tsc --noEmit, app and service worker)
        run: npm run typecheck --workspace=@puppet-master/app

  # The frontend build the Rust jobs compile against, built once. tauri::generate_context! embeds
  # packages/app/dist (frontendDist); nothing else of the npm build is needed to compile or run the tests.
  web-dist:
    name: Frontend build for the Rust jobs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@puppet-master/shared

      # Only the vite output. The full app build also bundles cloudflared, the phone app and the MCP
      # server (with a Rust build of the MCP exe) into src-tauri/resources: release-only, no test reads them.
      - name: Build the frontend (vite)
        working-directory: packages/app
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/app/dist
          retention-days: 1
          if-no-files-found: error

  rust:
    # ~2,800 tests, each in its own process: split over three runners. Many spawn git and node (missions,
    # worktrees, checkpoints) and slow each other down when several share a 4-vCPU runner.
    name: Rust unit tests (${{ matrix.shard }}/3)
    needs: [changes, web-dist]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Tests do not use the bundle's resources (cloudflared, the phone app, the MCP exe), which the
      # web-dist job does not build; tauri-build would otherwise insist that their globs match files.
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
      # The LLVM linker that ships with rustc: links the big test executables faster than link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No rust-toolchain.toml in the repo, so this is the stable channel.
      - uses: dtolnay/rust-toolchain@stable

      # One cache for every Rust job (same dependencies, same profile, same paths).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests
          workspaces: |
            packages/app/src-tauri
            tools/pm-fake-tui
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/app/dist

      - name: Unit tests in the library and the binaries
        working-directory: packages/app/src-tauri
        run: cargo nextest run --profile ci --lib --bins --partition count:${{ matrix.shard }}/3

  fake-tui:
    # Dev-only fake agent (tools/pm-fake-tui) on a real ConPTY and a PowerShell host, which the
    # windows-latest runner has. Every test runs in its own process with its own app-data folder
    # (src/fake_tui/world.rs), so the suite is split across four runners and runs in parallel on each.
    name: Fake agent e2e (${{ matrix.shard }}/4)
    needs: [changes, web-dist]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests
          workspaces: |
            packages/app/src-tauri
            tools/pm-fake-tui
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/app/dist

      # Unit tests of the fake agent itself (engine, script format, renderer), once.
      - name: pm-fake-tui unit tests
        if: matrix.shard == 1
        working-directory: tools/pm-fake-tui
        run: cargo test

      # Built once here so the test processes do not each run `cargo build` for it (src/fake_tui/world.rs).
      - name: Build pm-fake-tui
        working-directory: tools/pm-fake-tui
        run: |
          cargo build
          "PM_FAKE_TUI_EXE=$PWD\target\debug\pm-fake-tui.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # fake_tui_e2e.rs, which also includes the Missions and Wizard tests (tests/fake_tui_missions.rs,
      # tests/fake_tui_wizard.rs) through #[path], so there is no separate --test run for them (cargo
      # discovers those files as targets too, without the dev-fake-tui feature they need).
      - name: Fake agent end-to-end tests
        working-directory: packages/app/src-tauri
        run: cargo nextest run --profile ci --features dev-fake-tui --test fake_tui_e2e --partition count:${{ matrix.shard }}/4
