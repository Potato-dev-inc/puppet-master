# Puppet Master team relay on Cloudflare: a Worker (front door) + one Durable Object per team.
# Docs: README.md. Deploy: the button there, or `npm run deploy` after `npx wrangler login`.
name = "pm-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# By default the Worker answers on https://pm-relay.<your-account>.workers.dev. To use a name on a domain of
# your own (the domain must already be on Cloudflare), uncomment this and put your own name in. It must stay
# here, above the first [[...]] table.
# routes = [{ pattern = "relay.example.com", custom_domain = true }]

# One Durable Object per team (mailbox, access list, replay guard, rate limits) and one per client
# address (counts unauthenticated registrations and join requests). SQLite-backed, which is also
# what Cloudflare's free plan allows.
[[durable_objects.bindings]]
name = "TEAM"
class_name = "Team"

[[durable_objects.bindings]]
name = "GATE"
class_name = "IpGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Team", "IpGate"]

# Live Rooms: one object per room (its registration, newest snapshot and deltas, SQLite) and one object
# for the relay's open rooms (the cap of 100). Both are SQLite-backed, like the team objects.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "ROOM_INDEX"
class_name = "RoomIndex"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room", "RoomIndex"]

# The viewer page (relay/viewer/dist) is served as text from the Worker's own bundle, with the
# same policy as relay/server (see index.ts). Only these three names: the Worker's code is JavaScript too.
[[rules]]
type = "Text"
globs = ["**/viewer.html", "**/viewer.js", "**/viewer.css"]

# Optional limits (defaults match relay/server: 60 envelopes a minute and 5,000 a day per device,
# 600 a minute per team, 300 signed requests a minute per device, 5 join tries per invite, 200 join
# requests a day per team and 10 an hour per address and team, 30 team registrations an hour per address,
# 4 open sockets per device, 20,000 envelopes or 128 MiB stored per team, long polls up to 25 s).
# Uncomment to change.
# [vars]
# LIMIT_DEVICE_PER_MINUTE = "60"
# LIMIT_DEVICE_PER_DAY = "5000"
# LIMIT_TEAM_PER_MINUTE = "600"
# LIMIT_DEVICE_REQUESTS_PER_MINUTE = "300"
# LIMIT_JOINS_PER_INVITE = "5"
# LIMIT_JOINS_PER_TEAM_PER_DAY = "200"
# LIMIT_JOINS_PER_ADDRESS_PER_HOUR = "10"
# LIMIT_UNAUTH_PER_IP_PER_HOUR = "30"
# LIMIT_SOCKETS_PER_DEVICE = "4"
# LIMIT_TEAM_MAX_ENVELOPES = "20000"
# LIMIT_TEAM_MAX_BYTES = "134217728"
# LIMIT_MAX_WAIT_S = "25"
# Live Rooms (relay/server defaults): 10 registrations an hour per address, 120 viewer calls a minute per
# address, 100 open rooms on the relay.
# LIMIT_ROOMS_PER_ADDRESS_PER_HOUR = "10"
# LIMIT_ROOM_VIEWS_PER_MINUTE = "120"
# LIMIT_ROOM_MAX_OPEN = "100"
# Never set TEST_HOOKS on a real deployment: it opens /v1/_test (read and wipe a team's data).

[observability]
enabled = true
