[package]
name = "pm-relay"
version = "0.1.0"
edition = "2021"
# Licence pending the founder's decision (AGPL-3.0 or proprietary): see ../LICENSE.
license-file = "../LICENSE"
publish = false
description = "The Puppet Master team relay: a self-hostable, end-to-end encrypted mailbox for teammates' Puppet Masters. It stores sealed envelopes for 7 days and never sees their content."

[lib]
name = "pm_relay"
path = "src/lib.rs"

[[bin]]
name = "pm-relay"
path = "src/main.rs"

[dependencies]
pm-relay-protocol = { path = "../protocol" }
# HTTP + WebSocket server (MIT).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# The mailbox (MIT); `bundled` compiles SQLite in, so the relay is one file to run.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ed25519-dalek = "2"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
