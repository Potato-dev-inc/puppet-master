[package]
name = "pm-relay-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Wire types of the Puppet Master team relay: sealed envelopes, signed team state, join boxes and device request signing. No I/O."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
